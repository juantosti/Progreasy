  const pack = document.createElement('div');
  pack.className = 'pack';

  const header = document.createElement('div');
  header.className = 'pack-header';
  header.innerHTML = `
    <div class="pack-left">
      <span class="pack-label">Pack ${g.key}</span>
      <span class="pack-count">+20 tracks</span>

    <div class="pack-right">

  `;
  pack.appendChild(header);

  const tracksDiv = document.createElement('div');
  tracksDiv.className = 'pack-tracks';
  let n = 1;
  g.previews.forEach((t, ti) => {
    const data = t.sc ? t : { name: t.name, locked: true };
    tracksDiv.appendChild(createTrack(data, n++, `g${gi}-t${ti}`));
  });
  pack.appendChild(tracksDiv);

  const more = document.createElement('div');
  more.className = 'more-row';
  more.textContent = '+ 18 tracks más en este pack';
  pack.appendChild(more);

  container.appendChild(pack);
