<div class="inner packs" id="groups-container"></div>

<script>
const SHOPIFY_URL = 'https://progreasy.myshopify.com/';
const PRICE = '$8.250';

// 12 tonalidades Camelot (1A a 12A). Pega 2 URLs de SoundCloud por grupo.
const TONALIDADES = [
  { key: "1A",  previews: [
      { name: "Preview 01", sc: "https://soundcloud.com/juan-tosticarelli-526503295/v20" },
      { name: "Preview 02", sc: "https://soundcloud.com/juan-tosticarelli-526503295/shalom-cmin-122" },
  ]},
  { key: "2A",  previews: [{ name: "Preview 01", sc: "" }, { name: "Preview 02", sc: "" }] },
  { key: "3A",  previews: [{ name: "Preview 01", sc: "" }, { name: "Preview 02", sc: "" }] },
  { key: "4A",  previews: [{ name: "Preview 01", sc: "" }, { name: "Preview 02", sc: "" }] },
  { key: "5A",  previews: [{ name: "Preview 01", sc: "" }, { name: "Preview 02", sc: "" }] },
  { key: "6A",  previews: [{ name: "Preview 01", sc: "" }, { name: "Preview 02", sc: "" }] },
  { key: "7A",  previews: [{ name: "Preview 01", sc: "" }, { name: "Preview 02", sc: "" }] },
  { key: "8A",  previews: [{ name: "Preview 01", sc: "" }, { name: "Preview 02", sc: "" }] },
  { key: "9A",  previews: [{ name: "Preview 01", sc: "" }, { name: "Preview 02", sc: "" }] },
  { key: "10A", previews: [{ name: "Preview 01", sc: "" }, { name: "Preview 02", sc: "" }] },
  { key: "11A", previews: [{ name: "Preview 01", sc: "" }, { name: "Preview 02", sc: "" }] },
  { key: "12A", previews: [{ name: "Preview 01", sc: "" }, { name: "Preview 02", sc: "" }] },
];

const container = document.getElementById('groups-container');

TONALIDADES.forEach((g, gi) => {
  const pack = document.createElement('div');
  pack.className = 'pack';

  const header = document.createElement('div');
  header.className = 'pack-header';
  header.innerHTML = `
    <div class="pack-left">
      <span class="pack-label">Pack ${g.key}</span>
      <span class="pack-count">12 tracks</span>
    </div>
    <div class="pack-right">
      <span class="pack-price">${PRICE}</span>
      <button class="buy-btn" onclick="window.open(SHOPIFY_URL, '_blank')">Comprar</button>
    </div>
  `;
  pack.appendChild(header);

  const tracksDiv = document.createElement('div');
  tracksDiv.className = 'pack-tracks';
  let n = 1;
  g.previews.forEach((t, ti) => {
    const data = t.sc ? t : { name: t.name, locked: true };
    tracksDiv.appendChild(createTrack(data, n++, `g${gi}-t${ti}`));
  });
  pack.appendChild(tracksDiv);

  const more = document.createElement('div');
  more.className = 'more-row';
  more.textContent = '+ 10 tracks más en este pack';
  pack.appendChild(more);

  container.appendChild(pack);
});
</script>
